<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img">
<style>text{font-family:Arial,sans-serif;fill:#162b42} .title{font-size:24px;font-weight:700}.label{font-size:20px}.small{font-size:16px}.box{fill:#eef5fc;stroke:#32689c;stroke-width:2}.plane{stroke:#197d70;stroke-width:5}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8" fill="#52657b"/></marker></defs>
<title>SciFi topology and nominal station z constants</title><desc>Source: LHCB-TDR-015 section 3.3 for topology; Detector FT proto-run5-v00.01 parameters.xml for station z constants. This diagram is not to scale and does not depict complete LHCb geometry.</desc>
<text x="30" y="34" class="title">SciFi: downstream of the magnet, upstream of RICH2</text>
<line x1="30" y1="220" x2="1160" y2="220" stroke="#52657b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="31" y="249" class="small">IP / upstream tracking</text><text x="1060" y="249" class="small">beam direction +z</text>
<rect x="170" y="75" width="130" height="120" rx="8" class="box"/><text x="190" y="140" class="label">Magnet</text>
<rect x="1020" y="75" width="130" height="120" rx="8" class="box"/><text x="1040" y="140" class="label">RICH2</text>
<text x="410" y="72" class="title">T1</text>
<line x1="360" y1="95" x2="360" y2="195" class="plane"/><text x="350" y="272" class="small">X1</text>
<line x1="398" y1="95" x2="398" y2="195" class="plane"/><text x="388" y="272" class="small">U</text>
<line x1="436" y1="95" x2="436" y2="195" class="plane"/><text x="426" y="272" class="small">V</text>
<line x1="474" y1="95" x2="474" y2="195" class="plane"/><text x="464" y="272" class="small">X2</text>
<text x="375" y="300" class="label">z = 7.941 m</text>
<text x="630" y="72" class="title">T2</text>
<line x1="580" y1="95" x2="580" y2="195" class="plane"/><text x="570" y="272" class="small">X1</text>
<line x1="618" y1="95" x2="618" y2="195" class="plane"/><text x="608" y="272" class="small">U</text>
<line x1="656" y1="95" x2="656" y2="195" class="plane"/><text x="646" y="272" class="small">V</text>
<line x1="694" y1="95" x2="694" y2="195" class="plane"/><text x="684" y="272" class="small">X2</text>
<text x="595" y="300" class="label">z = 8.533 m</text>
<text x="850" y="72" class="title">T3</text>
<line x1="800" y1="95" x2="800" y2="195" class="plane"/><text x="790" y="272" class="small">X1</text>
<line x1="838" y1="95" x2="838" y2="195" class="plane"/><text x="828" y="272" class="small">U</text>
<line x1="876" y1="95" x2="876" y2="195" class="plane"/><text x="866" y="272" class="small">V</text>
<line x1="914" y1="95" x2="914" y2="195" class="plane"/><text x="904" y="272" class="small">X2</text>
<text x="815" y="300" class="label">z = 9.125 m</text>
<text x="30" y="328" class="small">Nominal Run 5 constants; not aligned positions. Three stations × four planes = 12. Not to scale.</text></svg>