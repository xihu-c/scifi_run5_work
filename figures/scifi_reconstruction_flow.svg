<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img">
<style>text{font-family:Arial,sans-serif;fill:#162b42} .title{font-size:24px;font-weight:700}.label{font-size:20px}.small{font-size:16px}.box{fill:#eef5fc;stroke:#32689c;stroke-width:2}.plane{stroke:#197d70;stroke-width:5}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8" fill="#52657b"/></marker></defs>
<title>General tracking chain and the FT-only validation path</title><desc>General matching branch is shown separately from the executed FT-only test. Source: Moore upgrade2_reconstruction.py and run5_scifi_time_kalman_test.py.</desc>
<text x="25" y="34" class="title">General reconstruction context</text>
<rect x="25" y="60" width="165" height="60" rx="7" class="box"/><text x="35" y="97" class="label">Clusters / hits</text>
<rect x="235" y="60" width="140" height="60" rx="7" class="box"/><text x="245" y="97" class="label">FT seeds</text>
<rect x="420" y="60" width="210" height="60" rx="7" class="box"/><text x="430" y="97" class="label">Track matching</text>
<rect x="680" y="60" width="180" height="60" rx="7" class="box"/><text x="690" y="97" class="label">Track fit</text>
<rect x="905" y="60" width="260" height="60" rx="7" class="box"/><text x="915" y="97" class="label">Vertex / physics</text>
<line x1="190" y1="90" x2="230" y2="90" stroke="#52657b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="375" y1="90" x2="415" y2="90" stroke="#52657b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="630" y1="90" x2="675" y2="90" stroke="#52657b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="860" y1="90" x2="900" y2="90" stroke="#52657b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="420" y="145" class="small">TV / upstream tracks also enter matching.</text>
<text x="25" y="205" class="title">Executed validation: FT-only, no matching or vertex reconstruction</text>
<rect x="25" y="230" width="165" height="75" rx="7" fill="#e7f6ef" stroke="#197d70" stroke-width="2"/><text x="35" y="260" class="label">Timed FT hits</text><text x="35" y="286" class="small">MC-based model</text>
<rect x="235" y="230" width="155" height="75" rx="7" fill="#e7f6ef" stroke="#197d70" stroke-width="2"/><text x="245" y="260" class="label">FT seeding</text><text x="245" y="286" class="small">spatial / timing</text>
<rect x="435" y="230" width="230" height="75" rx="7" fill="#e7f6ef" stroke="#197d70" stroke-width="2"/><text x="445" y="260" class="label">Spatial reference fit</text><text x="445" y="286" class="small">then optional 7D fit</text>
<rect x="710" y="230" width="180" height="75" rx="7" fill="#e7f6ef" stroke="#197d70" stroke-width="2"/><text x="720" y="260" class="label">v1 track output</text><text x="720" y="286" class="small">full 7D at reference</text>
<rect x="935" y="230" width="230" height="75" rx="7" fill="#e7f6ef" stroke="#197d70" stroke-width="2"/><text x="945" y="260" class="label">MC association</text><text x="945" y="286" class="small">spatial track checker</text>
<line x1="190" y1="267" x2="230" y2="267" stroke="#52657b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="390" y1="267" x2="430" y2="267" stroke="#52657b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="665" y1="267" x2="705" y2="267" stroke="#52657b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="890" y1="267" x2="930" y2="267" stroke="#52657b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="25" y="350" class="small">General algorithms form a dependency graph; this is not a mandatory single global sequence. Forward tracking is another branch.</text></svg>